name: Deploy to QA

on:
  push:
    branches: [qa]

env:
  NODE_VERSION: "20"
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=qa
            type=sha,prefix=qa-

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_API_URL=https://negocios.qa.financieramentecu.co
            NEXT_TELEMETRY_DISABLED=1
            BUILD_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to QA
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add SSH known hosts
        run: |
          ssh-keyscan -H ${{ secrets.QA_DROPLET_IP }} >> ~/.ssh/known_hosts

      - name: Copy Docker files to server
        run: |
          rsync -avz --delete \
            --exclude='nginx/ssl' \
            -e "ssh -o StrictHostKeyChecking=no" \
            ./docker/ root@${{ secrets.QA_DROPLET_IP }}:/opt/financieramente/docker/

      - name: Copy SSL scripts to server
        run: |
          ssh -o StrictHostKeyChecking=no root@${{ secrets.QA_DROPLET_IP }} "mkdir -p /opt/financieramente/terraform/scripts"
          scp -o StrictHostKeyChecking=no terraform/scripts/ssl-renew.sh terraform/scripts/setup-ssl.sh root@${{ secrets.QA_DROPLET_IP }}:/opt/financieramente/terraform/scripts/
          ssh -o StrictHostKeyChecking=no root@${{ secrets.QA_DROPLET_IP }} "chmod +x /opt/financieramente/terraform/scripts/ssl-renew.sh /opt/financieramente/terraform/scripts/setup-ssl.sh"

      - name: Deploy application
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.QA_DROPLET_IP }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 30m
          script: |
            set -euo pipefail

            COMPOSE_FILE_PATH=/opt/financieramente/docker/docker-compose.qa.yml
            IMAGE_NAME="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"

            # Replace image placeholder in docker-compose file
            sed -i "s#__IMAGE_NAME__#${IMAGE_NAME}#g" "$COMPOSE_FILE_PATH"

            # Create .env file
            PASSWORD='${{ secrets.POSTGRES_PASSWORD_QA }}'
            ENCODED_PASSWORD=$(PASSWORD="$PASSWORD" python3 - <<'PYCODE'
            import os
            import urllib.parse
            print(urllib.parse.quote(os.environ["PASSWORD"], safe=''))
            PYCODE
            )
            cat > /opt/financieramente/.env << 'ENVEOF'
            NODE_ENV=production
            APP_ENV=qa
            POSTGRES_USER=financieramente_user
            POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD_QA }}
            POSTGRES_DB=financieramente_qa
            DATABASE_URL=postgresql://financieramente_user:__ENCODED_PASSWORD__@postgres:5432/financieramente_qa
            DIRECT_URL=postgresql://financieramente_user:__ENCODED_PASSWORD__@postgres:5432/financieramente_qa
            NEXT_PUBLIC_API_URL=https://negocios.qa.financieramentecu.co
            NEXTAUTH_SECRET=${{ secrets.NEXTAUTH_SECRET_QA }}
            NEXTAUTH_URL=https://negocios.qa.financieramentecu.co
            AUTH_TRUST_HOST=true
            GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID_QA }}
            GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET_QA }}
            AUTH_DEBUG=true
            NEXT_TELEMETRY_DISABLED=1
            SENDGRID_API_KEY=${{ secrets.SENDGRID_API_KEY_QA }}
            SENDGRID_FROM_EMAIL=${{ secrets.SENDGRID_FROM_EMAIL_QA }}
            SENDGRID_FROM_NAME=${{ secrets.SENDGRID_FROM_NAME_QA }}
            SENDGRID_TEMPLATE_ID=${{ secrets.SENDGRID_TEMPLATE_ID_QA }}
            SUPER_ADMIN_PASSWORD=${{ secrets.SUPER_ADMIN_PASSWORD_QA }}
            ENVEOF
            sed -i "s#__ENCODED_PASSWORD__#${ENCODED_PASSWORD}#g" /opt/financieramente/.env

            cp /opt/financieramente/.env /opt/financieramente/docker/.env

            cd /opt/financieramente

            # Create SSL directory and self-signed certificates if they don't exist
            # IMPORTANT: Do this BEFORE starting containers to prevent nginx restart loops
            SSL_DIR=/opt/financieramente/docker/nginx/ssl
            mkdir -p "$SSL_DIR"

            echo "=== Checking SSL certificates ==="
            echo "SSL Directory: $SSL_DIR"
            ls -la "$SSL_DIR" || echo "Directory does not exist or is empty"

            if [ -f "$SSL_DIR/cert.pem" ]; then
              echo "✅ cert.pem exists ($(stat -c%s "$SSL_DIR/cert.pem") bytes)"
              echo "Certificate details:"
              openssl x509 -in "$SSL_DIR/cert.pem" -noout -subject -dates 2>/dev/null || echo "Could not read certificate details"
            else
              echo "❌ cert.pem does not exist"
            fi

            if [ -f "$SSL_DIR/key.pem" ]; then
              echo "✅ key.pem exists ($(stat -c%s "$SSL_DIR/key.pem") bytes)"
            else
              echo "❌ key.pem does not exist"
            fi

            if [ ! -f "$SSL_DIR/cert.pem" ] || [ ! -f "$SSL_DIR/key.pem" ]; then
              echo "Creating self-signed SSL certificates..."
              if command -v openssl >/dev/null 2>&1; then
                openssl req -x509 -nodes -days 365 -newkey rsa:2048 \
                  -keyout "$SSL_DIR/key.pem" \
                  -out "$SSL_DIR/cert.pem" \
                  -subj "/C=CO/ST=State/L=City/O=Financieramente/CN=negocios.qa.financieramentecu.co"
                chmod 644 "$SSL_DIR/cert.pem"
                chmod 600 "$SSL_DIR/key.pem"
                
                # Verify certificates were created
                if [ -f "$SSL_DIR/cert.pem" ] && [ -f "$SSL_DIR/key.pem" ]; then
                  echo "✅ Self-signed certificates created and verified"
                  echo "Certificate location: $SSL_DIR"
                  ls -lh "$SSL_DIR"
                else
                  echo "❌ Failed to create certificates"
                  exit 1
                fi
              else
                echo "❌ openssl not found, cannot create certificates"
                echo "Please install openssl or configure SSL certificates manually"
                exit 1
              fi
            else
              echo "✅ SSL certificates already exist, skipping creation"
              echo "Verifying certificates are readable..."
              ls -lh "$SSL_DIR"
            fi

            # Final verification before starting containers
            echo "=== Final SSL verification ==="
            if [ ! -f "$SSL_DIR/cert.pem" ] || [ ! -f "$SSL_DIR/key.pem" ]; then
              echo "❌ CRITICAL: SSL certificates are missing before container startup"
              echo "Expected location: $SSL_DIR"
              echo "Current directory contents:"
              ls -la "$SSL_DIR" || echo "Directory does not exist!"
              exit 1
            fi
            echo "✅ SSL certificates verified and ready"

            # Login to GHCR
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Stop existing containers
            docker-compose -f "$COMPOSE_FILE_PATH" down --timeout 30 || true
            docker container prune -f || true

            # Pull and start new containers
            docker-compose -f "$COMPOSE_FILE_PATH" pull

            # Verify SSL certificates one more time before starting
            if [ ! -f "$SSL_DIR/cert.pem" ] || [ ! -f "$SSL_DIR/key.pem" ]; then
              echo "❌ SSL certificates missing right before container startup!"
              exit 1
            fi

            # Start containers (postgres and nextjs first, then nginx)
            docker-compose -f "$COMPOSE_FILE_PATH" up -d postgres nextjs

            # Wait a moment for postgres and nextjs to start
            sleep 5

            # Now start nginx (which requires SSL certificates)
            docker-compose -f "$COMPOSE_FILE_PATH" up -d nginx

            # Wait a moment and verify nginx can see the certificates
            sleep 3
            echo "=== Verifying nginx can access SSL certificates ==="
            if docker-compose -f "$COMPOSE_FILE_PATH" exec -T nginx test -f /etc/nginx/ssl/cert.pem && \
               docker-compose -f "$COMPOSE_FILE_PATH" exec -T nginx test -f /etc/nginx/ssl/key.pem; then
              echo "✅ Nginx can access SSL certificates inside container"
              docker-compose -f "$COMPOSE_FILE_PATH" exec -T nginx ls -lh /etc/nginx/ssl/
            else
              echo "❌ Nginx cannot access SSL certificates inside container"
              echo "Host SSL directory: $SSL_DIR"
              ls -la "$SSL_DIR"
              echo "Container SSL directory:"
              docker-compose -f "$COMPOSE_FILE_PATH" exec -T nginx ls -la /etc/nginx/ssl/ || echo "Cannot access container SSL directory"
              docker-compose -f "$COMPOSE_FILE_PATH" logs nginx --tail=20
              exit 1
            fi

            # Wait for PostgreSQL to be ready
            echo "Waiting for PostgreSQL to be ready..."
            for i in {1..30}; do
              if docker-compose -f "$COMPOSE_FILE_PATH" exec -T postgres pg_isready -U financieramente_user -d financieramente_qa > /dev/null 2>&1; then
                echo "✅ PostgreSQL is ready"
                break
              fi
              echo "⏳ Waiting for PostgreSQL... ($i/30)"
              sleep 2
            done

            # Verify PostgreSQL is accessible
            docker-compose -f "$COMPOSE_FILE_PATH" exec -T postgres psql -U financieramente_user -d financieramente_qa -c "SELECT 1" > /dev/null 2>&1 || {
              echo "❌ PostgreSQL connection failed"
              exit 1
            }

            # Run database migrations inside the nextjs container
            echo "Running Prisma migrations inside nextjs container..."
            # Verify prisma directory exists before running migrations
            docker-compose -f "$COMPOSE_FILE_PATH" exec -T nextjs sh -c "cd /app && ls -la prisma/ && test -f prisma/schema.prisma && echo '✅ Prisma schema found'" || {
              echo "❌ Prisma schema not found in container"
              docker-compose -f "$COMPOSE_FILE_PATH" exec -T nextjs sh -c "cd /app && ls -la && pwd"
              exit 1
            }
            docker-compose -f "$COMPOSE_FILE_PATH" exec -T nextjs sh -c "cd /app && npx prisma@6.18.0 migrate deploy" || {
              echo "❌ Migration failed"
              docker-compose -f "$COMPOSE_FILE_PATH" logs nextjs --tail=50
              exit 1
            }
            echo "✅ Migrations applied successfully"

            cd /opt/financieramente

            # Wait for services
            sleep 30

            # Check container status
            docker-compose -f "$COMPOSE_FILE_PATH" ps

            # Ensure SSL renewal cron (idempotent): remove old ssl-renew entries, add correct path (no app/ on server)
            (crontab -l 2>/dev/null | grep -v 'ssl-renew.sh' || true
             echo "0 3 * * 0 /opt/financieramente/terraform/scripts/ssl-renew.sh qa >> /var/log/financieramente/ssl-renew-cron.log 2>&1") | crontab -

      - name: Health check
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.QA_DROPLET_IP }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 10m
          script: |
            set -euo pipefail

            COMPOSE_FILE_PATH=/opt/financieramente/docker/docker-compose.qa.yml

            echo "Checking container status..."
            docker-compose -f "$COMPOSE_FILE_PATH" ps

            echo "Checking if nextjs container is responding..."
            for i in {1..10}; do
              if docker-compose -f "$COMPOSE_FILE_PATH" exec -T nextjs curl -f http://localhost:3000/api/health > /dev/null 2>&1; then
                echo "✅ Next.js container is responding"
                break
              fi
              echo "⏳ Waiting for Next.js... ($i/10)"
              sleep 5
            done

            echo "Checking nginx container status..."
            # Wait for nginx to be running (not restarting)
            for i in {1..30}; do
              NGINX_STATUS=$(docker-compose -f "$COMPOSE_FILE_PATH" ps nginx | grep -q "Up" && echo "running" || echo "not_running")
              if [ "$NGINX_STATUS" = "running" ]; then
                echo "✅ Nginx container is running"
                break
              fi
              echo "⏳ Waiting for nginx to be running... ($i/30)"
              sleep 2
            done

            # Check if nginx is in restart loop
            NGINX_RESTART_COUNT=$(docker-compose -f "$COMPOSE_FILE_PATH" ps nginx | grep -o "Restarting" | wc -l || echo "0")
            if [ "$NGINX_RESTART_COUNT" -gt 0 ]; then
              echo "❌ Nginx is in restart loop"
              echo "=== Nginx Error Logs ==="
              docker-compose -f "$COMPOSE_FILE_PATH" logs nginx --tail=50
              echo "=== Checking SSL certificates ==="
              docker-compose -f "$COMPOSE_FILE_PATH" exec -T nginx ls -la /etc/nginx/ssl/ || echo "Cannot access SSL directory"
              exit 1
            fi

            echo "Checking if nginx can reach nextjs..."
            if docker-compose -f "$COMPOSE_FILE_PATH" exec -T nginx wget -qO- http://nextjs:3000/api/health > /dev/null 2>&1; then
              echo "✅ Nginx can reach Next.js"
            else
              echo "❌ Nginx cannot reach Next.js"
              echo "Checking nginx network connectivity..."
              docker-compose -f "$COMPOSE_FILE_PATH" exec -T nginx ping -c 2 nextjs || echo "Cannot ping nextjs"
              docker-compose -f "$COMPOSE_FILE_PATH" logs nginx --tail=30
              docker-compose -f "$COMPOSE_FILE_PATH" logs nextjs --tail=30
              exit 1
            fi

            echo "Checking nginx on port 80..."
            sleep 10
            for i in {1..15}; do
              echo "Health check attempt $i/15..."
              if curl -f http://localhost:80/health > /dev/null 2>&1; then
                echo "✅ Health check passed on port 80"
                break
              fi
              if [ $i -eq 15 ]; then
                echo "❌ Health check failed on port 80"
                echo "=== Nginx Error Logs ==="
                docker-compose -f "$COMPOSE_FILE_PATH" logs nginx --tail=50
                echo "=== Next.js Logs ==="
                docker-compose -f "$COMPOSE_FILE_PATH" logs nextjs --tail=50
                echo "=== Testing nginx configuration ==="
                docker-compose -f "$COMPOSE_FILE_PATH" exec -T nginx nginx -t || true
                exit 1
              fi
              sleep 10
            done

            echo "Checking application endpoint through nginx..."
            if curl -f -L http://localhost:80/login > /dev/null 2>&1; then
              echo "✅ Application endpoint is responding through nginx"
            else
              echo "⚠️ Application endpoint check failed"
              echo "Response code: $(curl -s -o /dev/null -w '%{http_code}' http://localhost:80/login || echo 'failed')"
              docker-compose -f "$COMPOSE_FILE_PATH" logs nginx --tail=20
              docker-compose -f "$COMPOSE_FILE_PATH" logs nextjs --tail=20
            fi

            echo "=== Final Container Status ==="
            docker-compose -f "$COMPOSE_FILE_PATH" ps

      - name: Cleanup old images
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.QA_DROPLET_IP }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 5m
          script: |
            docker image prune -f
            docker volume prune -f
            df -h

      - name: Deployment success notification
        if: success()
        run: |
          echo "🎉 Deployment to QA completed successfully!"
          echo "🌐 QA Environment: http://${{ secrets.QA_DROPLET_IP }}"
          echo "📊 Commit: ${{ github.sha }}"
          echo "👤 Author: ${{ github.actor }}"

      - name: Deployment failure notification
        if: failure()
        run: |
          echo "❌ Deployment to QA failed!"
          echo "🔍 Check the logs above for details"
          echo "📊 Commit: ${{ github.sha }}"
          echo "👤 Author: ${{ github.actor }}"
