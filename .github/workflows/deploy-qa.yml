name: Deploy to QA

on:
  push:
    branches: [qa]

env:
  NODE_VERSION: "20"
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  deploy:
    name: Deploy to QA
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy files to server
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          ssh-keyscan -H ${{ secrets.QA_DROPLET_IP }} >> ~/.ssh/known_hosts 2>/dev/null || true

          rsync -avz --delete \
            --exclude='node_modules' \
            --exclude='.next' \
            --exclude='.git' \
            --exclude='coverage' \
            --exclude='storybook-static' \
            --exclude='test-results' \
            --exclude='*.log' \
            --exclude='.dockerignore' \
            --exclude='html' \
            --exclude='terraform' \
            -e "ssh -o StrictHostKeyChecking=no" \
            ./ root@${{ secrets.QA_DROPLET_IP }}:/opt/financieramente/app/

          scp -o StrictHostKeyChecking=no \
            -r ./docker/* root@${{ secrets.QA_DROPLET_IP }}:/opt/financieramente/

      - name: Deploy application
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.QA_DROPLET_IP }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 30m
          script: |
            # Create .env file
            cat > /opt/financieramente/.env << 'ENVEOF'
            NODE_ENV=qa
            POSTGRES_USER=financieramente_user
            POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD_QA }}
            POSTGRES_DB=financieramente_qa
            DATABASE_URL=postgresql://financieramente_user:${{ secrets.POSTGRES_PASSWORD_QA }}@postgres:5432/financieramente_qa
            NEXT_PUBLIC_API_URL=https://negocios.qa.financieramentecu.co
            NEXTAUTH_SECRET=${{ secrets.NEXTAUTH_SECRET_QA }}
            NEXTAUTH_URL=https://negocios.qa.financieramentecu.co
            GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID_QA }}
            GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET_QA }}
            NEXT_TELEMETRY_DISABLED=1
            ENVEOF

            cp /opt/financieramente/.env /opt/financieramente/app/.env

            cd /opt/financieramente

            # Enable Docker BuildKit
            export DOCKER_BUILDKIT=1
            export COMPOSE_DOCKER_CLI_BUILD=1

            # Stop existing containers
            docker-compose -f docker-compose.qa.yml down --timeout 30 || true
            docker container prune -f || true

            # Clean Docker build cache to avoid stale builds
            docker builder prune -f || true

            # Clean Next.js cache if it exists
            rm -rf /opt/financieramente/app/.next || true

            # Build and start new containers (no cache to ensure fresh build)
            docker-compose -f docker-compose.qa.yml build --no-cache --parallel
            docker-compose -f docker-compose.qa.yml up -d

            # Wait for PostgreSQL to be ready
            echo "Waiting for PostgreSQL to be ready..."
            for i in {1..30}; do
              if docker-compose -f /opt/financieramente/docker-compose.qa.yml exec -T postgres pg_isready -U financieramente_user -d financieramente_qa > /dev/null 2>&1; then
                echo "✅ PostgreSQL is ready"
                break
              fi
              echo "⏳ Waiting for PostgreSQL... ($i/30)"
              sleep 2
            done

            # Verify PostgreSQL is accessible
            docker-compose -f /opt/financieramente/docker-compose.qa.yml exec -T postgres psql -U financieramente_user -d financieramente_qa -c "SELECT 1" > /dev/null 2>&1 || {
              echo "❌ PostgreSQL connection failed"
              exit 1
            }

            # Run database migrations inside the nextjs container
            echo "Running Prisma migrations inside nextjs container..."
            # Verify prisma directory exists before running migrations
            docker-compose -f /opt/financieramente/docker-compose.qa.yml exec -T nextjs sh -c "cd /app && ls -la prisma/ && test -f prisma/schema.prisma && echo '✅ Prisma schema found'" || {
              echo "❌ Prisma schema not found in container"
              docker-compose -f /opt/financieramente/docker-compose.qa.yml exec -T nextjs sh -c "cd /app && ls -la && pwd"
              exit 1
            }
            docker-compose -f /opt/financieramente/docker-compose.qa.yml exec -T nextjs sh -c "cd /app && npx prisma migrate deploy" || {
              echo "❌ Migration failed"
              docker-compose -f /opt/financieramente/docker-compose.qa.yml logs nextjs --tail=50
              exit 1
            }
            echo "✅ Migrations applied successfully"

            cd /opt/financieramente

            # Wait for services
            sleep 30

            # Check container status
            docker-compose -f docker-compose.qa.yml ps

      - name: Health check
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.QA_DROPLET_IP }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 10m
          script: |
            sleep 30

            for i in {1..15}; do
              echo "Health check attempt $i/15..."
              if curl -f http://localhost:3000/api/health; then
                echo "✅ Health check passed"
                exit 0
              fi
              sleep 10
            done

            echo "❌ Health check failed"
            cd /opt/financieramente
            docker-compose -f docker-compose.qa.yml logs --tail=50
            exit 1

      - name: Cleanup old images
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.QA_DROPLET_IP }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 5m
          script: |
            docker image prune -f
            docker volume prune -f
            df -h

      - name: Deployment success notification
        if: success()
        run: |
          echo "🎉 Deployment to QA completed successfully!"
          echo "🌐 QA Environment: http://${{ secrets.QA_DROPLET_IP }}"
          echo "📊 Commit: ${{ github.sha }}"
          echo "👤 Author: ${{ github.actor }}"

      - name: Deployment failure notification
        if: failure()
        run: |
          echo "❌ Deployment to QA failed!"
          echo "🔍 Check the logs above for details"
          echo "📊 Commit: ${{ github.sha }}"
          echo "👤 Author: ${{ github.actor }}"
