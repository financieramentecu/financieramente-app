name: Deploy to QA

on:
  push:
    branches: [qa]

env:
  NODE_VERSION: "20"
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=qa
            type=sha,prefix=qa-

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_API_URL=https://negocios.qa.financieramentecu.co
            NEXT_TELEMETRY_DISABLED=1
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to QA
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add SSH known hosts
        run: |
          ssh-keyscan -H ${{ secrets.QA_DROPLET_IP }} >> ~/.ssh/known_hosts

      - name: Copy Docker files to server
        run: |
          rsync -avz --delete \
            -e "ssh -o StrictHostKeyChecking=no" \
            ./docker/ root@${{ secrets.QA_DROPLET_IP }}:/opt/financieramente/docker/

      - name: Deploy application
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.QA_DROPLET_IP }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 30m
          script: |
            set -euo pipefail

            COMPOSE_FILE_PATH=/opt/financieramente/docker/docker-compose.qa.yml
            IMAGE_NAME="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"

            # Replace image placeholder in docker-compose file
            sed -i "s#__IMAGE_NAME__#${IMAGE_NAME}#g" "$COMPOSE_FILE_PATH"

            # Create .env file
            PASSWORD='${{ secrets.POSTGRES_PASSWORD_QA }}'
            ENCODED_PASSWORD=$(PASSWORD="$PASSWORD" python3 - <<'PYCODE'
            import os
            import urllib.parse
            print(urllib.parse.quote(os.environ["PASSWORD"], safe=''))
            PYCODE
            )
            cat > /opt/financieramente/.env << 'ENVEOF'
            NODE_ENV=qa
            POSTGRES_USER=financieramente_user
            POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD_QA }}
            POSTGRES_DB=financieramente_qa
            DATABASE_URL=postgresql://financieramente_user:__ENCODED_PASSWORD__@postgres:5432/financieramente_qa
            DIRECT_URL=postgresql://financieramente_user:__ENCODED_PASSWORD__@postgres:5432/financieramente_qa
            NEXT_PUBLIC_API_URL=https://negocios.qa.financieramentecu.co
            NEXTAUTH_SECRET=${{ secrets.NEXTAUTH_SECRET_QA }}
            NEXTAUTH_URL=https://negocios.qa.financieramentecu.co
            GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID_QA }}
            GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET_QA }}
            NEXT_TELEMETRY_DISABLED=1
            SENDGRID_API_KEY=${{ secrets.SENDGRID_API_KEY_QA }}
            SENDGRID_FROM_EMAIL=${{ secrets.SENDGRID_FROM_EMAIL_QA }}
            SENDGRID_FROM_NAME=${{ secrets.SENDGRID_FROM_NAME_QA }}
            SENDGRID_TEMPLATE_ID=${{ secrets.SENDGRID_TEMPLATE_ID_QA }}
            SUPER_ADMIN_PASSWORD=${{ secrets.SUPER_ADMIN_PASSWORD_QA }}
            ENVEOF
            sed -i "s#__ENCODED_PASSWORD__#${ENCODED_PASSWORD}#g" /opt/financieramente/.env

            cp /opt/financieramente/.env /opt/financieramente/docker/.env

            cd /opt/financieramente

            # Login to GHCR
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Stop existing containers
            docker-compose -f "$COMPOSE_FILE_PATH" down --timeout 30 || true
            docker container prune -f || true

            # Pull and start new containers
            docker-compose -f "$COMPOSE_FILE_PATH" pull
            docker-compose -f "$COMPOSE_FILE_PATH" up -d

            # Wait for PostgreSQL to be ready
            echo "Waiting for PostgreSQL to be ready..."
            for i in {1..30}; do
              if docker-compose -f "$COMPOSE_FILE_PATH" exec -T postgres pg_isready -U financieramente_user -d financieramente_qa > /dev/null 2>&1; then
                echo "✅ PostgreSQL is ready"
                break
              fi
              echo "⏳ Waiting for PostgreSQL... ($i/30)"
              sleep 2
            done

            # Verify PostgreSQL is accessible
            docker-compose -f "$COMPOSE_FILE_PATH" exec -T postgres psql -U financieramente_user -d financieramente_qa -c "SELECT 1" > /dev/null 2>&1 || {
              echo "❌ PostgreSQL connection failed"
              exit 1
            }

            # Run database migrations inside the nextjs container
            echo "Running Prisma migrations inside nextjs container..."
            # Verify prisma directory exists before running migrations
            docker-compose -f "$COMPOSE_FILE_PATH" exec -T nextjs sh -c "cd /app && ls -la prisma/ && test -f prisma/schema.prisma && echo '✅ Prisma schema found'" || {
              echo "❌ Prisma schema not found in container"
              docker-compose -f "$COMPOSE_FILE_PATH" exec -T nextjs sh -c "cd /app && ls -la && pwd"
              exit 1
            }
            docker-compose -f "$COMPOSE_FILE_PATH" exec -T nextjs sh -c "cd /app && npx prisma migrate deploy" || {
              echo "❌ Migration failed"
              docker-compose -f "$COMPOSE_FILE_PATH" logs nextjs --tail=50
              exit 1
            }
            echo "✅ Migrations applied successfully"

            cd /opt/financieramente

            # Wait for services
            sleep 30

            # Check container status
            docker-compose -f "$COMPOSE_FILE_PATH" ps

      - name: Health check
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.QA_DROPLET_IP }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 10m
          script: |
            set -euo pipefail

            COMPOSE_FILE_PATH=/opt/financieramente/docker/docker-compose.qa.yml

            sleep 30

            for i in {1..15}; do
              echo "Health check attempt $i/15..."
              if curl -f http://localhost:3000/api/health; then
                echo "✅ Health check passed"
                exit 0
              fi
              sleep 10
            done

            echo "❌ Health check failed"
            cd /opt/financieramente
            docker-compose -f "$COMPOSE_FILE_PATH" logs --tail=50
            exit 1

      - name: Cleanup old images
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.QA_DROPLET_IP }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 5m
          script: |
            docker image prune -f
            docker volume prune -f
            df -h

      - name: Deployment success notification
        if: success()
        run: |
          echo "🎉 Deployment to QA completed successfully!"
          echo "🌐 QA Environment: http://${{ secrets.QA_DROPLET_IP }}"
          echo "📊 Commit: ${{ github.sha }}"
          echo "👤 Author: ${{ github.actor }}"

      - name: Deployment failure notification
        if: failure()
        run: |
          echo "❌ Deployment to QA failed!"
          echo "🔍 Check the logs above for details"
          echo "📊 Commit: ${{ github.sha }}"
          echo "👤 Author: ${{ github.actor }}"
