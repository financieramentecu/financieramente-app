name: Deploy to QA

on:
  push:
    branches: [qa]
  pull_request:
    types: [opened, synchronize, closed]
    branches: [qa]

env:
  NODE_VERSION: "20"
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: |
            .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('**/*.js', '**/*.jsx', '**/*.ts', '**/*.tsx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-

      - name: Run linter
        run: npm run lint

      - name: Run unit tests
        run: npm run test:unit

      - name: Build application
        run: npm run build

  deploy:
    name: Deploy to QA
    runs-on: ubuntu-latest
    needs: test
    if: |
      github.event_name == 'push' || 
      (github.event_name == 'pull_request' && 
       github.event.action == 'closed' && 
       github.event.pull_request.merged == true)

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.merged == true && github.event.pull_request.merge_commit_sha || github.ref }}

      - name: Copy files to server
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          ssh-keyscan -H ${{ secrets.QA_DROPLET_IP }} >> ~/.ssh/known_hosts 2>/dev/null || true

          rsync -avz --delete \
            --exclude='node_modules' \
            --exclude='.next' \
            --exclude='.git' \
            --exclude='coverage' \
            --exclude='storybook-static' \
            --exclude='test-results' \
            --exclude='*.log' \
            --exclude='.dockerignore' \
            --exclude='html' \
            --exclude='terraform' \
            -e "ssh -o StrictHostKeyChecking=no" \
            ./ root@${{ secrets.QA_DROPLET_IP }}:/opt/financieramente/app/

          scp -o StrictHostKeyChecking=no \
            -r ./docker/* root@${{ secrets.QA_DROPLET_IP }}:/opt/financieramente/

      - name: Deploy application
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.QA_DROPLET_IP }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 30m
          script: |
            # Create .env file
            cat > /opt/financieramente/.env << 'ENVEOF'
            NODE_ENV=qa
            POSTGRES_USER=financieramente_user
            POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD_QA }}
            POSTGRES_DB=financieramente_qa
            DATABASE_URL=postgresql://financieramente_user:${{ secrets.POSTGRES_PASSWORD_QA }}@postgres:5432/financieramente_qa
            NEXT_PUBLIC_API_URL=http://${{ secrets.QA_DROPLET_IP }}
            ENVEOF

            cp /opt/financieramente/.env /opt/financieramente/app/.env

            cd /opt/financieramente

            # Enable Docker BuildKit
            export DOCKER_BUILDKIT=1
            export COMPOSE_DOCKER_CLI_BUILD=1

            # Stop existing containers
            docker-compose -f docker-compose.qa.yml down --timeout 30 || true
            docker container prune -f || true

            # Build and start new containers
            docker-compose -f docker-compose.qa.yml build --parallel
            docker-compose -f docker-compose.qa.yml up -d

            # Wait for PostgreSQL to be ready
            echo "Waiting for PostgreSQL to be ready..."
            sleep 30

            # Run database migrations
            cd /opt/financieramente/app
            docker-compose -f /opt/financieramente/docker-compose.qa.yml exec -T postgres psql -U financieramente_user -d financieramente_qa -c "SELECT 1" > /dev/null 2>&1 || sleep 10

            echo "Running Prisma migrations..."
            npx prisma generate
            npx prisma migrate deploy || {
              echo "❌ Migration failed"
              exit 1
            }
            echo "✅ Migrations applied successfully"

            cd /opt/financieramente

            # Wait for services
            sleep 30

            # Check container status
            docker-compose -f docker-compose.qa.yml ps

      - name: Health check
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.QA_DROPLET_IP }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 10m
          script: |
            sleep 30

            for i in {1..15}; do
              echo "Health check attempt $i/15..."
              if curl -f http://localhost:3000/api/health; then
                echo "✅ Health check passed"
                exit 0
              fi
              sleep 10
            done

            echo "❌ Health check failed"
            cd /opt/financieramente
            docker-compose -f docker-compose.qa.yml logs --tail=50
            exit 1

      - name: Cleanup old images
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.QA_DROPLET_IP }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 5m
          script: |
            docker image prune -f
            docker volume prune -f
            df -h

      - name: Deployment success notification
        if: success()
        run: |
          echo "🎉 Deployment to QA completed successfully!"
          echo "🌐 QA Environment: http://${{ secrets.QA_DROPLET_IP }}"
          echo "📊 Commit: ${{ github.sha }}"
          echo "👤 Author: ${{ github.actor }}"

      - name: Deployment failure notification
        if: failure()
        run: |
          echo "❌ Deployment to QA failed!"
          echo "🔍 Check the logs above for details"
          echo "📊 Commit: ${{ github.sha }}"
          echo "👤 Author: ${{ github.actor }}"
