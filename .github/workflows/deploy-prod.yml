name: Deploy to Production

on:
  push:
    branches: [master]

env:
  NODE_VERSION: "20"
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add SSH known hosts
        run: |
          ssh-keyscan -H ${{ secrets.PROD_DROPLET_IP }} >> ~/.ssh/known_hosts

      - name: Pre-deployment backup
        run: |
          ssh root@${{ secrets.PROD_DROPLET_IP }} << 'EOF'
          cd /opt/financieramente

          # Create backup directory with timestamp
          BACKUP_DIR="backup_$(date +%Y%m%d_%H%M%S)"
          mkdir -p backups/$BACKUP_DIR

          # Backup current application
          if [ -d "app" ]; then
            cp -r app backups/$BACKUP_DIR/
            echo "✅ Application backed up to backups/$BACKUP_DIR"
          fi

          # Backup database
          if docker-compose -f docker-compose.prod.yml ps postgres | grep -q "Up"; then
            docker-compose -f docker-compose.prod.yml exec -T postgres pg_dump -U financieramente_user financieramente_prod > backups/$BACKUP_DIR/database_backup.sql
            echo "✅ Database backed up to backups/$BACKUP_DIR/database_backup.sql"
          fi
          EOF

      - name: Copy files to server
        run: |
          # Create app directory structure
          ssh root@${{ secrets.PROD_DROPLET_IP }} "mkdir -p /opt/financieramente/app"

          # Copy application files
          rsync -avz --delete \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='.next' \
            --exclude='*.log' \
            ./ root@${{ secrets.PROD_DROPLET_IP }}:/opt/financieramente/app/

      - name: Copy Docker files
        run: |
          # Copy Docker configuration
          scp -r ./docker/* root@${{ secrets.PROD_DROPLET_IP }}:/opt/financieramente/

      - name: Setup environment variables
        run: |
          ssh root@${{ secrets.PROD_DROPLET_IP }} << 'EOF'
          cd /opt/financieramente

          # Create environment file
          cat > .env << 'ENVEOF'
          NODE_ENV=production
          POSTGRES_USER=financieramente_user
          POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD_PROD }}
          POSTGRES_DB=financieramente_prod
          DATABASE_URL=postgresql://financieramente_user:${{ secrets.POSTGRES_PASSWORD_PROD }}@postgres:5432/financieramente_prod
          DIRECT_URL=postgresql://financieramente_user:${{ secrets.POSTGRES_PASSWORD_PROD }}@postgres:5432/financieramente_prod
          NEXT_PUBLIC_API_URL=https://negocios.financieramentecu.co
          NEXTAUTH_SECRET=${{ secrets.NEXTAUTH_SECRET_PROD }}
          NEXTAUTH_URL=https://negocios.financieramentecu.co
          GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID_PROD }}
          GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET_PROD }}
          NEXT_TELEMETRY_DISABLED=1
          ENVEOF

          # Copy environment to app directory
          cp .env app/.env
          EOF

      - name: Deploy application
        run: |
          ssh root@${{ secrets.PROD_DROPLET_IP }} << 'EOF'
          cd /opt/financieramente

          # Stop existing containers gracefully
          docker-compose -f docker-compose.prod.yml down --timeout 30 || true

          # Clean Docker build cache to avoid stale builds
          docker builder prune -f || true

          # Clean Next.js cache if it exists
          rm -rf /opt/financieramente/app/.next || true

          # Build and start new containers (no cache to ensure fresh build)
          docker-compose -f docker-compose.prod.yml build --no-cache
          docker-compose -f docker-compose.prod.yml up -d

          # Wait for PostgreSQL to be ready
          echo "Waiting for PostgreSQL to be ready..."
          for i in {1..30}; do
            if docker-compose -f /opt/financieramente/docker-compose.prod.yml exec -T postgres pg_isready -U financieramente_user -d financieramente_prod > /dev/null 2>&1; then
              echo "✅ PostgreSQL is ready"
              break
            fi
            echo "⏳ Waiting for PostgreSQL... ($i/30)"
            sleep 2
          done

          # Verify PostgreSQL is accessible
          docker-compose -f /opt/financieramente/docker-compose.prod.yml exec -T postgres psql -U financieramente_user -d financieramente_prod -c "SELECT 1" > /dev/null 2>&1 || {
            echo "❌ PostgreSQL connection failed"
            exit 1
          }

          # Run database migrations inside the nextjs container
          echo "Running Prisma migrations inside nextjs container..."
          # Verify prisma directory exists before running migrations
          docker-compose -f /opt/financieramente/docker-compose.prod.yml exec -T nextjs sh -c "cd /app && ls -la prisma/ && test -f prisma/schema.prisma && echo '✅ Prisma schema found'" || {
            echo "❌ Prisma schema not found in container"
            docker-compose -f /opt/financieramente/docker-compose.prod.yml exec -T nextjs sh -c "cd /app && ls -la && pwd"
            exit 1
          }
          docker-compose -f /opt/financieramente/docker-compose.prod.yml exec -T nextjs sh -c "cd /app && npx prisma migrate deploy" || {
            echo "❌ Migration failed"
            docker-compose -f /opt/financieramente/docker-compose.prod.yml logs nextjs --tail=50
            exit 1
          }
          echo "✅ Migrations applied successfully"

          # Wait for services to be ready
          echo "Waiting for services to start..."
          sleep 30
          EOF

      - name: Health check
        run: |
          # Wait a bit more for services to stabilize
          sleep 30

          # Check if the application is responding
          for i in {1..15}; do
            if curl -f http://${{ secrets.PROD_DROPLET_IP }}/health; then
              echo "✅ Health check passed"
              break
            else
              echo "⏳ Health check attempt $i/15 failed, retrying..."
              sleep 10
            fi
          done

          # Final health check
          if ! curl -f http://${{ secrets.PROD_DROPLET_IP }}/health; then
            echo "❌ Health check failed after 15 attempts"
            exit 1
          fi

      - name: Verify database connection
        run: |
          ssh root@${{ secrets.PROD_DROPLET_IP }} << 'EOF'
          cd /opt/financieramente/app

          # Test database connection
          if npx prisma db pull --print > /dev/null 2>&1; then
            echo "✅ Database connection verified"
          else
            echo "❌ Database connection failed"
            exit 1
          fi
          EOF

      - name: Verify all services
        run: |
          ssh root@${{ secrets.PROD_DROPLET_IP }} << 'EOF'
          cd /opt/financieramente

          # Check all containers are running
          if docker-compose -f docker-compose.prod.yml ps | grep -q "Up"; then
            echo "✅ All containers are running"
            docker-compose -f docker-compose.prod.yml ps
          else
            echo "❌ Some containers are not running"
            docker-compose -f docker-compose.prod.yml ps
            exit 1
          fi
          EOF

      - name: Cleanup old images
        run: |
          ssh root@${{ secrets.PROD_DROPLET_IP }} << 'EOF'
          # Remove unused Docker images (keep last 3)
          docker image prune -f

          # Remove old backups (keep last 7 days)
          find /opt/financieramente/backups -type d -mtime +7 -exec rm -rf {} + 2>/dev/null || true
          EOF

      - name: Deployment success notification
        if: success()
        run: |
          echo "🎉 Deployment to Production completed successfully!"
          echo "🌐 Production Environment: http://${{ secrets.PROD_DROPLET_IP }}"
          echo "📊 Commit: ${{ github.sha }}"
          echo "👤 Author: ${{ github.actor }}"
          echo "⏰ Deployed at: $(date)"

      - name: Rollback on failure
        if: failure()
        run: |
          echo "❌ Deployment to Production failed! Initiating rollback..."

          ssh root@${{ secrets.PROD_DROPLET_IP }} << 'EOF'
          cd /opt/financieramente

          # Find the latest backup
          LATEST_BACKUP=$(ls -t backups/ | head -n1)

          if [ -n "$LATEST_BACKUP" ]; then
            echo "🔄 Rolling back to backup: $LATEST_BACKUP"
            
            # Stop current containers
            docker-compose -f docker-compose.prod.yml down
            
            # Restore application files
            if [ -d "backups/$LATEST_BACKUP/app" ]; then
              rm -rf app
              cp -r backups/$LATEST_BACKUP/app .
              echo "✅ Application files restored"
            fi
            
            # Restart with previous version
            docker-compose -f docker-compose.prod.yml up -d
            
            echo "✅ Rollback completed"
          else
            echo "❌ No backup found for rollback"
          fi
          EOF

      - name: Deployment failure notification
        if: failure()
        run: |
          echo "❌ Deployment to Production failed!"
          echo "🔍 Check the logs above for details"
          echo "📊 Commit: ${{ github.sha }}"
          echo "👤 Author: ${{ github.actor }}"
          echo "⏰ Failed at: $(date)"
