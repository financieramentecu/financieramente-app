name: Deploy to Production

on:
  push:
    branches: [main]

env:
  NODE_VERSION: "20"
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=prod
            type=sha,prefix=prod-

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_API_URL=https://negocios.financieramentecu.co
            NEXT_TELEMETRY_DISABLED=1
            AUTH_SECRET=${{ secrets.NEXTAUTH_SECRET_PROD }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add SSH known hosts
        run: |
          ssh-keyscan -H ${{ secrets.PROD_DROPLET_IP }} >> ~/.ssh/known_hosts

      - name: Pre-deployment backup
        run: |
          ssh root@${{ secrets.PROD_DROPLET_IP }} << 'EOF'
          set -euo pipefail

          cd /opt/financieramente

          COMPOSE_FILE_PATH=/opt/financieramente/docker/docker-compose.prod.yml

          # Create backup directory with timestamp
          BACKUP_DIR="backup_$(date +%Y%m%d_%H%M%S)"
          mkdir -p backups/$BACKUP_DIR

          # Backup database
          if docker-compose -f "$COMPOSE_FILE_PATH" ps postgres | grep -q "Up"; then
            docker-compose -f "$COMPOSE_FILE_PATH" exec -T postgres pg_dump -U financieramente_user financieramente_prod > backups/$BACKUP_DIR/database_backup.sql
            echo "✅ Database backed up to backups/$BACKUP_DIR/database_backup.sql"
          fi
          EOF

      - name: Copy Docker files
        run: |
          rsync -avz --delete \
            --exclude='nginx/ssl' \
            -e "ssh -o StrictHostKeyChecking=no" \
            ./docker/ root@${{ secrets.PROD_DROPLET_IP }}:/opt/financieramente/docker/

      - name: Copy SSL scripts to server
        run: |
          ssh -o StrictHostKeyChecking=no root@${{ secrets.PROD_DROPLET_IP }} "mkdir -p /opt/financieramente/terraform/scripts"
          scp -o StrictHostKeyChecking=no terraform/scripts/ssl-renew.sh terraform/scripts/setup-ssl.sh root@${{ secrets.PROD_DROPLET_IP }}:/opt/financieramente/terraform/scripts/
          ssh -o StrictHostKeyChecking=no root@${{ secrets.PROD_DROPLET_IP }} "chmod +x /opt/financieramente/terraform/scripts/ssl-renew.sh /opt/financieramente/terraform/scripts/setup-ssl.sh"

      - name: Setup environment variables
        run: |
          ssh root@${{ secrets.PROD_DROPLET_IP }} << 'EOF'
          cd /opt/financieramente

          # Create environment file
          PASSWORD='${{ secrets.POSTGRES_PASSWORD_PROD }}'
          ENCODED_PASSWORD=$(PASSWORD="$PASSWORD" python3 - <<'PYCODE'
          import os
          import urllib.parse
          print(urllib.parse.quote(os.environ["PASSWORD"], safe=''))
          PYCODE
          )
          cat > .env << 'ENVEOF'
          NODE_ENV=production
          POSTGRES_USER=financieramente_user
          POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD_PROD }}
          POSTGRES_DB=financieramente_prod
          DATABASE_URL=postgresql://financieramente_user:__ENCODED_PASSWORD__@postgres:5432/financieramente_prod
          DIRECT_URL=postgresql://financieramente_user:__ENCODED_PASSWORD__@postgres:5432/financieramente_prod
          NEXT_PUBLIC_API_URL=https://negocios.financieramentecu.co
          NEXTAUTH_SECRET=${{ secrets.NEXTAUTH_SECRET_PROD }}
          NEXTAUTH_URL=https://negocios.financieramentecu.co
          AUTH_TRUST_HOST=true
          GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID_PROD }}
          GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET_PROD }}
          NEXT_TELEMETRY_DISABLED=1
          SENDGRID_API_KEY=${{ secrets.SENDGRID_API_KEY_PROD }}
          SENDGRID_FROM_EMAIL=${{ secrets.SENDGRID_FROM_EMAIL_PROD }}
          SENDGRID_FROM_NAME=${{ secrets.SENDGRID_FROM_NAME_PROD }}
          SENDGRID_TEMPLATE_ID=${{ secrets.SENDGRID_TEMPLATE_ID_PROD }}
          SUPER_ADMIN_PASSWORD=${{ secrets.SUPER_ADMIN_PASSWORD_PROD }}
          DO_SPACES_KEY=${{ secrets.DO_SPACES_KEY }}
          DO_SPACES_SECRET=${{ secrets.DO_SPACES_SECRET }}
          DO_SPACES_ENDPOINT=${{ secrets.DO_SPACES_ENDPOINT }}
          DO_SPACES_BUCKET=${{ secrets.DO_SPACES_BUCKET }}
          DO_SPACES_PREFIX=prod
          ENVEOF
          sed -i "s#__ENCODED_PASSWORD__#${ENCODED_PASSWORD}#g" .env

          # Copy environment to docker directory
          cp .env docker/.env

          # Create SSL directory and self-signed certificates if they don't exist
          SSL_DIR=/opt/financieramente/docker/nginx/ssl
          mkdir -p "$SSL_DIR"

          echo "=== Checking SSL certificates ==="
          echo "SSL Directory: $SSL_DIR"
          ls -la "$SSL_DIR" || echo "Directory does not exist or is empty"

          if [ -f "$SSL_DIR/cert.pem" ]; then
            echo "✅ cert.pem exists ($(stat -c%s "$SSL_DIR/cert.pem") bytes)"
            echo "Certificate details:"
            openssl x509 -in "$SSL_DIR/cert.pem" -noout -subject -dates 2>/dev/null || echo "Could not read certificate details"
          else
            echo "❌ cert.pem does not exist"
          fi

          if [ -f "$SSL_DIR/key.pem" ]; then
            echo "✅ key.pem exists ($(stat -c%s "$SSL_DIR/key.pem") bytes)"
          else
            echo "❌ key.pem does not exist"
          fi

          if [ ! -f "$SSL_DIR/cert.pem" ] || [ ! -f "$SSL_DIR/key.pem" ]; then
            echo "Creating self-signed SSL certificates..."
            if command -v openssl >/dev/null 2>&1; then
              openssl req -x509 -nodes -days 365 -newkey rsa:2048 \
                -keyout "$SSL_DIR/key.pem" \
                -out "$SSL_DIR/cert.pem" \
                -subj "/C=CO/ST=State/L=City/O=Financieramente/CN=negocios.financieramentecu.co"
              chmod 644 "$SSL_DIR/cert.pem"
              chmod 600 "$SSL_DIR/key.pem"
              echo "✅ Self-signed certificates created"
            else
              echo "❌ openssl not found, cannot create certificates"
              echo "Please install openssl or configure SSL certificates manually"
              exit 1
            fi
          else
            echo "✅ SSL certificates already exist, skipping creation"
          fi
          EOF

      - name: Deploy application
        run: |
          ssh root@${{ secrets.PROD_DROPLET_IP }} << 'EOF'
          set -euo pipefail

          cd /opt/financieramente

          COMPOSE_FILE_PATH=/opt/financieramente/docker/docker-compose.prod.yml
          IMAGE_NAME="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"

          # Replace image placeholder in docker-compose file
          sed -i "s#__IMAGE_NAME__#${IMAGE_NAME}#g" "$COMPOSE_FILE_PATH"

          # Login to GHCR
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

          # Stop existing containers gracefully
          docker-compose -f "$COMPOSE_FILE_PATH" down --timeout 30 || true

          # Pull and start new containers
          docker-compose -f "$COMPOSE_FILE_PATH" pull
          docker-compose -f "$COMPOSE_FILE_PATH" up -d

          # Wait for PostgreSQL to be ready
          echo "Waiting for PostgreSQL to be ready..."
          for i in {1..30}; do
            if docker-compose -f "$COMPOSE_FILE_PATH" exec -T postgres pg_isready -U financieramente_user -d financieramente_prod > /dev/null 2>&1; then
              echo "✅ PostgreSQL is ready"
              break
            fi
            echo "⏳ Waiting for PostgreSQL... ($i/30)"
            sleep 2
          done

          # Verify PostgreSQL is accessible
          docker-compose -f "$COMPOSE_FILE_PATH" exec -T postgres psql -U financieramente_user -d financieramente_prod -c "SELECT 1" > /dev/null 2>&1 || {
            echo "❌ PostgreSQL connection failed"
            exit 1
          }

          # Run database migrations inside the nextjs container
          echo "Running Prisma migrations inside nextjs container..."
          # Verify prisma directory exists before running migrations
          docker-compose -f "$COMPOSE_FILE_PATH" exec -T nextjs sh -c "cd /app && ls -la prisma/ && test -f prisma/schema.prisma && echo '✅ Prisma schema found'" || {
            echo "❌ Prisma schema not found in container"
            docker-compose -f "$COMPOSE_FILE_PATH" exec -T nextjs sh -c "cd /app && ls -la && pwd"
            exit 1
          }
          docker-compose -f "$COMPOSE_FILE_PATH" exec -T nextjs sh -c "cd /app && npx prisma@6.18.0 migrate deploy" || {
            echo "❌ Migration failed"
            docker-compose -f "$COMPOSE_FILE_PATH" logs nextjs --tail=50
            exit 1
          }
          echo "✅ Migrations applied successfully"

          # Ensure SSL renewal cron (idempotent): remove old ssl-renew entries, add correct path (no app/ on server)
          (crontab -l 2>/dev/null | grep -v 'ssl-renew.sh' || true
           echo "0 3 * * * /opt/financieramente/terraform/scripts/ssl-renew.sh prod >> /var/log/financieramente/ssl-renew-cron.log 2>&1") | crontab -

          # Wait for services to be ready
          echo "Waiting for services to start..."
          sleep 30
          EOF

      - name: Health check
        run: |
          # Wait a bit more for services to stabilize
          sleep 30

          # Check if the application is responding
          for i in {1..15}; do
            if curl -f http://${{ secrets.PROD_DROPLET_IP }}/health; then
              echo "✅ Health check passed"
              break
            else
              echo "⏳ Health check attempt $i/15 failed, retrying..."
              sleep 10
            fi
          done

          # Final health check
          if ! curl -f http://${{ secrets.PROD_DROPLET_IP }}/health; then
            echo "❌ Health check failed after 15 attempts"
            exit 1
          fi

      - name: Verify all services
        run: |
          ssh root@${{ secrets.PROD_DROPLET_IP }} << 'EOF'
          set -euo pipefail

          cd /opt/financieramente

          COMPOSE_FILE_PATH=/opt/financieramente/docker/docker-compose.prod.yml

          # Check all containers are running
          if docker-compose -f "$COMPOSE_FILE_PATH" ps | grep -q "Up"; then
            echo "✅ All containers are running"
            docker-compose -f "$COMPOSE_FILE_PATH" ps
          else
            echo "❌ Some containers are not running"
            docker-compose -f "$COMPOSE_FILE_PATH" ps
            exit 1
          fi
          EOF

      - name: Cleanup old images
        run: |
          ssh root@${{ secrets.PROD_DROPLET_IP }} << 'EOF'
          # Remove unused Docker images
          docker image prune -f

          # Remove old backups (keep last 7 days)
          find /opt/financieramente/backups -type d -mtime +7 -exec rm -rf {} + 2>/dev/null || true
          EOF

      - name: Deployment success notification
        if: success()
        run: |
          echo "🎉 Deployment to Production completed successfully!"
          echo "🌐 Production Environment: http://${{ secrets.PROD_DROPLET_IP }}"
          echo "📊 Commit: ${{ github.sha }}"
          echo "👤 Author: ${{ github.actor }}"
          echo "⏰ Deployed at: $(date)"

      - name: Rollback on failure
        if: failure()
        run: |
          echo "❌ Deployment to Production failed! Initiating rollback..."

          ssh root@${{ secrets.PROD_DROPLET_IP }} << 'EOF'
          set -euo pipefail

          cd /opt/financieramente

          COMPOSE_FILE_PATH=/opt/financieramente/docker/docker-compose.prod.yml

          # Find the latest backup
          LATEST_BACKUP=$(ls -t backups/ | head -n1)

          if [ -n "$LATEST_BACKUP" ]; then
            echo "🔄 Rolling back to backup: $LATEST_BACKUP"
            
            # Stop current containers
            docker-compose -f "$COMPOSE_FILE_PATH" down
            
            # Restore database from backup
            if [ -f "backups/$LATEST_BACKUP/database_backup.sql" ]; then
              docker-compose -f "$COMPOSE_FILE_PATH" up -d postgres
              sleep 10
              docker-compose -f "$COMPOSE_FILE_PATH" exec -T postgres psql -U financieramente_user -d financieramente_prod < backups/$LATEST_BACKUP/database_backup.sql
              echo "✅ Database restored from backup"
            fi
            
            # Pull previous image version (using SHA from backup or latest prod tag)
            docker-compose -f "$COMPOSE_FILE_PATH" pull || true
            
            # Restart with previous version
            docker-compose -f "$COMPOSE_FILE_PATH" up -d
            
            echo "✅ Rollback completed"
          else
            echo "❌ No backup found for rollback"
          fi
          EOF

      - name: Deployment failure notification
        if: failure()
        run: |
          echo "❌ Deployment to Production failed!"
          echo "🔍 Check the logs above for details"
          echo "📊 Commit: ${{ github.sha }}"
          echo "👤 Author: ${{ github.actor }}"
          echo "⏰ Failed at: $(date)"
