schema: spec-driven

artifact_store:
  mode: hybrid

context: |
  Domain: Financieramente — commission settlement for coaches and operations (liquidación de comisiones).
  Stack: Next.js 15 App Router, React 19, TypeScript 5, Prisma 6, PostgreSQL, Zod, React Hook Form, Tailwind CSS v4, NextAuth v5 (beta).
  Data: prisma/schema.prisma, migrations, seeds under prisma/seeds/.
  Testing: Vitest (unit + integration), Playwright E2E; ESLint 9 + Prettier; Husky.
  Layout: Feature-based in src/features/<feature>/ (components, hooks, lib, types, services, mappers, __tests__).
  Imports: Use path alias @/ only; avoid deep relative imports.
  API: src/app/api/ route handlers; Server Actions validate with Zod; use ApiResponse<T> for JSON.
  SDD: openspec/specs (baselines); openspec/changes/<change>/ (active); openspec/changes/archive/ (completed).
  Tech stack: Next.js 15.5.0, React 19.1.0, Tailwind CSS v4, Postgres, Prisma 6.18.0
  Architecture: Feature-Based Architecture (Screaming Architecture)
  Testing: vitest
  Style: default

strict_tdd: true

testing:
  runner: vitest
  unit: true
  integration: true
  e2e: true
  coverage: vitest --coverage
  linters: eslint

rules:
  proposal:
    - Include rollback plan for risky changes
    - Identify affected modules/packages
  specs:
    - Use Given/When/Then format for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
  design:
    - Include sequence diagrams for complex flows
    - Document architecture decisions with rationale
  tasks:
    - Group tasks by phase (infrastructure, implementation, testing)
    - Use hierarchical numbering (1.1, 1.2, etc.)
    - Keep tasks small enough to complete in one session
  apply:
    - Follow existing code patterns and conventions
    - Load relevant coding skills for the project stack
  verify:
    - Run tests if test infrastructure exists
    - Compare implementation against every spec scenario
  archive:
    - Warn before merging destructive deltas (large removals)
