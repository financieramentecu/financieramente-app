# Nginx configuration for Financieramente application
# Optimized for Next.js with security headers and performance

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
	worker_connections 1024;
	use epoll;  # Linux only; omit on BSD/macOS or use kqueue
	multi_accept on;
}

http {
	include /etc/nginx/mime.types;
	default_type application/octet-stream;

	# WebSocket upgrade: send "upgrade" when client asks for it, else "" for upstream keepalive (see ngx_http_proxy_module)
	map $http_upgrade $connection_upgrade {
		default upgrade;
		''      "";
	}

	# Logging format
	log_format main '$remote_addr - $remote_user [$time_local] "$request" '
					'$status $body_bytes_sent "$http_referer" '
					'"$http_user_agent" "$http_x_forwarded_for" '
					'rt=$request_time uct="$upstream_connect_time" '
					'uht="$upstream_header_time" urt="$upstream_response_time"';

	access_log /var/log/nginx/access.log main;

	# Basic settings
	sendfile on;
	tcp_nopush on;
	tcp_nodelay on;
	keepalive_timeout 65;
	types_hash_max_size 2048;
	server_tokens off;

	# Gzip compression
	gzip on;
	gzip_vary on;
	gzip_min_length 1024;
	gzip_proxied any;
	gzip_comp_level 6;
	gzip_types
		text/plain
		text/css
		text/xml
		text/javascript
		application/json
		application/javascript
		application/xml+rss
		application/atom+xml
		image/svg+xml;

	# Rate limiting (zone "login" reserved for future use, e.g. /api/auth/signin)
	limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
	limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;

	# Upstream for Next.js
	# Keepalive limitado para mantener conexiones activas después de inactividad
	# pero con límites para prevenir reutilización de conexiones degradadas
	upstream nextjs {
		server nextjs:3000;
		keepalive 8;  # Número limitado de conexiones persistentes
		keepalive_timeout 4s;  # < 5s (Node.js default) para evitar race condition
		keepalive_requests 100;
	}

	# HTTP Server Block - Redirects to HTTPS (except health checks)
	server {
		listen 80;
		server_name negocios.qa.financieramentecu.co negocios.financieramentecu.co;
		
		# Health check endpoint (allow on HTTP for load balancers)
		location /health {
			access_log off;
			return 200 "healthy\n";
			add_header Content-Type text/plain;
		}
		
		# Redirect all other traffic to HTTPS
		# This prevents cookie/CSRF issues when users access via HTTP
		return 301 https://$server_name$request_uri;
	}

	# Fallback server block for other hostnames (health checks, etc.)
	server {
		listen 80 default_server;
		server_name _;
		root /var/www/html;

		# Security headers
		add_header X-Frame-Options "SAMEORIGIN" always;
		add_header X-Content-Type-Options "nosniff" always;
		add_header X-XSS-Protection "1; mode=block" always;
		add_header Referrer-Policy "strict-origin-when-cross-origin" always;
		add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self';" always;

		# Hide nginx version
		server_tokens off;

		# Health check endpoint
		location /health {
			access_log off;
			return 200 "healthy\n";
			add_header Content-Type text/plain;
		}

		# Auth routes - No rate limiting; Connection "close" to avoid 403 from stale keepalive reuse (see docs/DIAGNOSTIC_403_AUTH.md)
		location /api/auth/ {
			proxy_pass http://nextjs;
			proxy_http_version 1.1;
			proxy_set_header Connection "close";
			proxy_set_header Host $host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto $scheme;
			proxy_set_header X-Forwarded-Host $host;
			
			# Timeouts (reduced to prevent hanging connections)
			proxy_connect_timeout 10s;
			proxy_send_timeout 15s;
			proxy_read_timeout 15s;
			
			# Retry on upstream errors
			proxy_next_upstream error timeout http_502 http_503 http_504;
			proxy_next_upstream_tries 2;
			proxy_next_upstream_timeout 5s;
		}

		# API routes with rate limiting (excludes /api/auth/)
		location /api/ {
			limit_req zone=api burst=20 nodelay;
			
			proxy_pass http://nextjs;
			proxy_http_version 1.1;
			proxy_set_header Upgrade $http_upgrade;
			proxy_set_header Connection $connection_upgrade;
			proxy_set_header Host $host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto $scheme;
			proxy_set_header X-Forwarded-Host $host;
			proxy_cache_bypass $http_upgrade;
			
			# Timeouts (reduced to prevent hanging connections)
			proxy_connect_timeout 10s;
			proxy_send_timeout 15s;
			proxy_read_timeout 15s;
			
			# Retry on upstream errors
			proxy_next_upstream error timeout http_502 http_503 http_504;
			proxy_next_upstream_tries 2;
			proxy_next_upstream_timeout 5s;
		}

		# Static files (proxy_cache_valid needs proxy_cache zone; add_header still applies)
		location /_next/static/ {
			proxy_pass http://nextjs;
			proxy_cache_valid 200 1y;
			add_header Cache-Control "public, immutable";
		}

		# Images (proxy_cache_valid needs proxy_cache zone; add_header still applies)
		location ~* \.(jpg|jpeg|png|gif|ico|svg|webp)$ {
			proxy_pass http://nextjs;
			proxy_cache_valid 200 30d;
			add_header Cache-Control "public, max-age=2592000";
		}

		# Main application
		location / {
			proxy_pass http://nextjs;
			proxy_http_version 1.1;
			proxy_set_header Upgrade $http_upgrade;
			proxy_set_header Connection $connection_upgrade;
			proxy_set_header Host $host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto $scheme;
			proxy_cache_bypass $http_upgrade;
			
			# Timeouts (reduced to prevent hanging connections)
			proxy_connect_timeout 10s;
			proxy_send_timeout 15s;
			proxy_read_timeout 15s;
			
			# Retry on upstream errors
			proxy_next_upstream error timeout http_502 http_503 http_504;
			proxy_next_upstream_tries 2;
			proxy_next_upstream_timeout 5s;
		}

		# Block access to sensitive files
		location ~ /\. {
			deny all;
			access_log off;
			log_not_found off;
		}

		location ~ \.(env|log|sql)$ {
			deny all;
			access_log off;
			log_not_found off;
		}

		# Block common attack patterns
		location ~* /(wp-admin|wp-login|xmlrpc) {
			deny all;
			access_log off;
			log_not_found off;
		}
	}

	# HTTPS Server Block
	server {
		listen 443 ssl;
		http2 on;
		server_name negocios.qa.financieramentecu.co negocios.financieramentecu.co _;
		
		# SSL Certificate configuration
		ssl_certificate /etc/nginx/ssl/cert.pem;
		ssl_certificate_key /etc/nginx/ssl/key.pem;
		
		# SSL Configuration
		ssl_protocols TLSv1.2 TLSv1.3;
		ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
		ssl_prefer_server_ciphers off;
		ssl_session_cache shared:SSL:10m;
		ssl_session_timeout 10m;
		ssl_session_tickets off;
		
		# Security headers
		add_header X-Frame-Options "SAMEORIGIN" always;
		add_header X-Content-Type-Options "nosniff" always;
		add_header X-XSS-Protection "1; mode=block" always;
		add_header Referrer-Policy "strict-origin-when-cross-origin" always;
		add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self';" always;
		
		# HSTS (HTTP Strict Transport Security)
		add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
		
		server_tokens off;

		# Health check endpoint
		location /health {
			access_log off;
			return 200 "healthy\n";
			add_header Content-Type text/plain;
		}

		# Auth routes - No rate limiting; Connection "close" to avoid 403 from stale keepalive reuse (see docs/DIAGNOSTIC_403_AUTH.md)
		location /api/auth/ {
			proxy_pass http://nextjs;
			proxy_http_version 1.1;
			proxy_set_header Connection "close";
			proxy_set_header Host $host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto $scheme;
			proxy_set_header X-Forwarded-Host $host;
			
			# Timeouts (reduced to prevent hanging connections)
			proxy_connect_timeout 10s;
			proxy_send_timeout 15s;
			proxy_read_timeout 15s;
			
			# Retry on upstream errors
			proxy_next_upstream error timeout http_502 http_503 http_504;
			proxy_next_upstream_tries 2;
			proxy_next_upstream_timeout 5s;
		}

		# API routes with rate limiting (excludes /api/auth/)
		location /api/ {
			limit_req zone=api burst=20 nodelay;
			
			proxy_pass http://nextjs;
			proxy_http_version 1.1;
			proxy_set_header Upgrade $http_upgrade;
			proxy_set_header Connection $connection_upgrade;
			proxy_set_header Host $host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto $scheme;
			proxy_set_header X-Forwarded-Host $host;
			proxy_cache_bypass $http_upgrade;
			
			# Timeouts (reduced to prevent hanging connections)
			proxy_connect_timeout 10s;
			proxy_send_timeout 15s;
			proxy_read_timeout 15s;
			
			# Retry on upstream errors
			proxy_next_upstream error timeout http_502 http_503 http_504;
			proxy_next_upstream_tries 2;
			proxy_next_upstream_timeout 5s;
		}

		# Static files (proxy_cache_valid needs proxy_cache zone; add_header still applies)
		location /_next/static/ {
			proxy_pass http://nextjs;
			proxy_cache_valid 200 1y;
			add_header Cache-Control "public, immutable";
		}

		# Images (proxy_cache_valid needs proxy_cache zone; add_header still applies)
		location ~* \.(jpg|jpeg|png|gif|ico|svg|webp)$ {
			proxy_pass http://nextjs;
			proxy_cache_valid 200 30d;
			add_header Cache-Control "public, max-age=2592000";
		}

		# Main application
		location / {
			proxy_pass http://nextjs;
			proxy_http_version 1.1;
			proxy_set_header Upgrade $http_upgrade;
			proxy_set_header Connection $connection_upgrade;
			proxy_set_header Host $host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto $scheme;
			proxy_cache_bypass $http_upgrade;
			
			# Timeouts (reduced to prevent hanging connections)
			proxy_connect_timeout 10s;
			proxy_send_timeout 15s;
			proxy_read_timeout 15s;
			
			# Retry on upstream errors
			proxy_next_upstream error timeout http_502 http_503 http_504;
			proxy_next_upstream_tries 2;
			proxy_next_upstream_timeout 5s;
		}

		# Block access to sensitive files
		location ~ /\. {
			deny all;
			access_log off;
			log_not_found off;
		}

		location ~ \.(env|log|sql)$ {
			deny all;
			access_log off;
			log_not_found off;
		}

		# Block common attack patterns
		location ~* /(wp-admin|wp-login|xmlrpc) {
			deny all;
			access_log off;
			log_not_found off;
		}
	}

}
